[package]
name = "wist-control"
version = "0.1.2" #@gxl:set(version)
edition = "2024"
license = "Apache-2.0"
authors = ["wist Dev Team"]
description = "Reusable Control domain model for the wist agent control plane and center governance"
repository = "https://github.com/dayu-sec/wist-control"
homepage = "https://github.com/dayu-sec/wist-control"
documentation = "https://docs.rs/wist-control"
readme = "README.md"
keywords = ["wist", "control", "model", "agent", "governance"]
categories = ["data-structures", "config"]

[dependencies]
jumo-derive = "0.1"
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
wist-shared =  "0.1"

[dev-dependencies]
serde_json = "1.0"

[lib]
path = "src/lib.rs"
